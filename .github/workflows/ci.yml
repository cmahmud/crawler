name: CI

on:
  push:
    branches: [main, kernel-v1]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest
      - run: python -m syndcrawler --help

  redis:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SYNCRAWLER_TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[redis,dev]'
      - run: ruff check .
      - run: pytest tests/test_redis_frontier.py

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: syndcrawler_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d syndcrawler_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SYNCRAWLER_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/syndcrawler_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[postgres,dev]'
      - run: ruff check .
      - run: pytest tests/test_postgres_crawl_store.py tests/test_postgres_recrawl_claims.py

  server:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: syndcrawler_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d syndcrawler_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      SYNCRAWLER_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      SYNCRAWLER_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/syndcrawler_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[server,dev]'
      - run: ruff check .
      - run: >-
          pytest tests/test_server_runtime.py tests/test_control_plane_api.py
          tests/test_server_recrawl.py

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config >/dev/null
        env:
          SYNCRAWLER_POSTGRES_PASSWORD: ci-postgres-password
          SYNCRAWLER_API_TOKEN: ci-api-token

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[browser,dev]'
      - run: python -m playwright install --with-deps chromium
      - run: ruff check .
      - run: pytest tests/test_runtime_browser.py
